services:
  postgres:
    image: postgres:17-alpine
    container_name: movank-postgres
    environment:
      POSTGRES_DB: movank
      POSTGRES_USER: movank
      POSTGRES_PASSWORD: movank_dev
    ports:
      - "5432:5432"
    volumes:
      - movank_pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movank -d movank"]
      interval: 5s
      timeout: 5s
      retries: 10

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: movank-dragonfly
    command: ["--logtostderr"]
    ports:
      - "6379:6379"

volumes:
  movank_pgdata:
